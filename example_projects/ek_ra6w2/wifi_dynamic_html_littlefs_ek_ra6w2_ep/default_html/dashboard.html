<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .card-unit {
            font-size: 1.2em;
            color: #999;
            margin-left: 5px;
        }

        .filesystem-card {
            grid-column: 1 / -1;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .filesystem-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .fs-stat {
            text-align: center;
        }

        .fs-stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .fs-stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .files-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        .files-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        .files-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
        }

        .files-table tr:hover {
            background: #f9f9f9;
        }

        .file-icon {
            margin-right: 8px;
            color: #667eea;
        }

        .file-type-file {
            color: #4CAF50;
        }

        .file-type-dir {
            color: #FF9800;
        }

        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .last-update {
            font-size: 0.85em;
            color: #666;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .status {
                position: static;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="status">
        <div class="status-dot"></div>
        <span>Auto-refresh: <span id="countdown">15</span>s</span>
    </div>

    <div class="container">
        <h1>📊 Device Dashboard</h1>

        <div class="stats-grid">
            <div class="card">
                <div class="card-title">Temperature</div>
                <div class="card-value" id="temp">--<span class="card-unit">°C</span></div>
            </div>

            <div class="card">
                <div class="card-title">Humidity</div>
                <div class="card-value" id="humid">--<span class="card-unit">%</span></div>
            </div>
        </div>

        <div class="card filesystem-card">
            <div class="card-title">Filesystem Status</div>
            <div class="progress-bar">
                <div class="progress-fill" id="fs-progress">0%</div>
            </div>
            <div class="filesystem-stats">
                <div class="fs-stat">
                    <div class="fs-stat-label">Total Space</div>
                    <div class="fs-stat-value" id="fs-total">-- KB</div>
                </div>
                <div class="fs-stat">
                    <div class="fs-stat-label">Used Space</div>
                    <div class="fs-stat-value" id="fs-used">-- KB</div>
                </div>
                <div class="fs-stat">
                    <div class="fs-stat-label">Free Space</div>
                    <div class="fs-stat-value" id="fs-free">-- KB</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Files in Root Directory</div>
            <div id="files-container">
                <table class="files-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Size</th>
                        </tr>
                    </thead>
                    <tbody id="files-list">
                        <tr><td colspan="3" style="text-align: center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="error-message"></div>

        <div style="text-align: center; color: white; margin-top: 20px; opacity: 0.8;">
            <small>Last updated: <span id="last-update">Never</span></small>
        </div>
    </div>

    <script>
        let countdownTimer;
        let refreshInterval;
        const REFRESH_INTERVAL = 15000; // 15 seconds

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function updateCountdown() {
            const countdownElement = document.getElementById('countdown');
            let seconds = REFRESH_INTERVAL / 1000;
            
            countdownTimer = setInterval(() => {
                seconds--;
                countdownElement.textContent = seconds;
                if (seconds <= 0) {
                    seconds = REFRESH_INTERVAL / 1000;
                }
            }, 1000);
        }

        async function fetchData() {
            const errorDiv = document.getElementById('error-message');
            errorDiv.innerHTML = '';

            try {
                // Fetch all data
                const response = await fetch('/get_values');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();

                // Update temperature (extract numeric value)
                const tempMatch = data.temp ? data.temp.match(/(\d+)/) : null;
                document.getElementById('temp').innerHTML = tempMatch ? 
                    tempMatch[1] + '<span class="card-unit">°C</span>' : '--';

                // Update humidity (extract numeric value)
                const humidMatch = data.humid ? data.humid.match(/(\d+)/) : null;
                document.getElementById('humid').innerHTML = humidMatch ? 
                    humidMatch[1] + '<span class="card-unit">%</span>' : '--';

                // Update filesystem info
                if (data.fs_total !== undefined && data.fs_free !== undefined) {
                    const total = data.fs_total;
                    const free = data.fs_free;
                    const used = total - free;
                    const usedPercent = Math.round((used / total) * 100);

                    document.getElementById('fs-total').textContent = formatBytes(total);
                    document.getElementById('fs-used').textContent = formatBytes(used);
                    document.getElementById('fs-free').textContent = formatBytes(free);
                    
                    const progressFill = document.getElementById('fs-progress');
                    progressFill.style.width = usedPercent + '%';
                    progressFill.textContent = usedPercent + '%';
                }

                // Update files list
                if (data.files && Array.isArray(data.files)) {
                    const filesList = document.getElementById('files-list');
                    if (data.files.length === 0) {
                        filesList.innerHTML = '<tr><td colspan="3" style="text-align: center;">No files found</td></tr>';
                    } else {
                        filesList.innerHTML = data.files.map(file => {
                            const icon = file.type === 'dir' ? '📁' : '📄';
                            const typeClass = file.type === 'dir' ? 'file-type-dir' : 'file-type-file';
                            return `
                                <tr>
                                    <td><span class="file-icon">${icon}</span>${file.name}</td>
                                    <td><span class="${typeClass}">${file.type}</span></td>
                                    <td>${formatBytes(file.size)}</td>
                                </tr>
                            `;
                        }).join('');
                    }
                }

                // Update last update time
                const now = new Date();
                document.getElementById('last-update').textContent = now.toLocaleTimeString();

            } catch (error) {
                console.error('Error fetching data:', error);
                errorDiv.innerHTML = `<div class="error">⚠️ Error loading data: ${error.message}</div>`;
            }
        }

        // Initial fetch
        fetchData();
        updateCountdown();

        // Set up auto-refresh
        refreshInterval = setInterval(() => {
            fetchData();
        }, REFRESH_INTERVAL);

        // Handle page visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(refreshInterval);
                clearInterval(countdownTimer);
            } else {
                fetchData();
                updateCountdown();
                refreshInterval = setInterval(fetchData, REFRESH_INTERVAL);
            }
        });
    </script>
</body>
</html>
